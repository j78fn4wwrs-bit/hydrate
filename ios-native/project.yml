name: Dewby
options:
  bundleIdPrefix: com.mikejohnson
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dewby:
    type: application
    platform: iOS
    sources:
      - path: Dewby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikejohnson.hydrate
        PRODUCT_NAME: Dewby
        INFOPLIST_FILE: Dewby/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  DewbyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DewbyTests
    dependencies:
      - target: Dewby
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mikejohnson.hydrate.tests
schemes:
  Dewby:
    build:
      targets:
        Dewby: all
        DewbyTests: [test]
    test:
      targets: [DewbyTests]
